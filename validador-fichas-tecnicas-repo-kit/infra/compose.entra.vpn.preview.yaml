# Puerta HTTPS opcional para una prueba dentro de la VPN Fortinet.
# Requiere .env.entra-preview, certificados en data/local/vpn-tls y una URI
# SPA https://<VPN_BIND_IP>:5443/auth-redirect.html aceptada en Entra.
# No iniciar hasta que la CA de prueba sea confiable en ambos navegadores.
services:
  frontend-vpn:
    profiles: ['vpn']
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend-preview:
        condition: service_healthy

  vpn-gateway:
    profiles: ['vpn']
    image: nginx:1.29-alpine
    depends_on:
      frontend-vpn:
        condition: service_started
    ports:
      - '${VPN_BIND_IP:?Indica la IP de VPN}:5443:8443'
    volumes:
      - ./infra/nginx.vpn.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/local/vpn-tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./data/local/vpn-tls/server.key:/etc/nginx/tls/server.key:ro
    healthcheck:
      test: ['CMD', 'wget', '--no-check-certificate', '--quiet', '--tries=1', '--spider', 'https://127.0.0.1:8443/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
