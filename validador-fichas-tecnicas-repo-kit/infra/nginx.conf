server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /auth-redirect.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
