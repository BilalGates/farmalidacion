<!doctype html>
<html lang='es'>
  <head>
    <meta charset='UTF-8' />
    <link rel='icon' type='image/svg+xml' href='%BASE_URL%favicon.svg' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <meta name='description' content='Validador interno de fichas técnicas' />
    <script>
      try {
        const choice = localStorage.getItem('farmalidacion.theme')
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.dataset.density = localStorage.getItem('farmalidacion.density') === 'compact' ? 'compact' : 'comfortable'
      } catch {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.dataset.density = 'comfortable'
      }
    </script>
    <link rel='icon' type='image/svg+xml' href='/brand-mark.svg' />
    <title>Farmalidación</title>
  </head>
  <body>
    <div id='root'></div>
    <script type='module' src='/src/main.tsx'></script>
  </body>
</html>
