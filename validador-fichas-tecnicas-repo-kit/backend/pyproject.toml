[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'pharma-validator-api'
version = '0.1.0'
description = 'Backend del validador interno de fichas técnicas'
requires-python = '>=3.11'
dependencies = [
    'alembic>=1.19,<2',
    'fastapi>=0.115,<1',
    'pydantic-settings>=2.7,<3',
    'sqlalchemy>=2.0.52,<3',
    'uvicorn>=0.34,<1',
]

[project.optional-dependencies]
dev = ['httpx>=0.28,<1', 'mypy>=2.3,<3', 'pytest>=8.3,<9', 'ruff>=0.9,<1']

[tool.mypy]
python_version = '3.11'
strict = true
plugins = ['pydantic.mypy']

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM']
