name: pharma-validator

# El motor por defecto sigue siendo SQLite, como fija la especificación: con el
# volumen previsto no hay razón para PostgreSQL. El servicio `postgres` de abajo
# existe sólo para poder verificar la portabilidad del esquema, y está tras el
# perfil `postgres`: `docker compose up` no lo levanta.
#
#   docker compose --profile postgres up -d postgres
#   APP_DATABASE_URL=postgresql+psycopg://validator:validator@localhost:5432/validator \
#     python -m alembic -c backend/alembic.ini upgrade head
#
# Ver docs/DATABASE_PORTABILITY.md.

services:
  # Modo DEMO: datos de demostración, base propia y desechable.
  #
  #   docker compose --profile demo up --build
  #
  # No comparte volumen con el modo REAL. Que un revisor no pueda confundir un
  # valor de demostración con uno importado empieza por no guardarlos juntos.
  backend:
    profiles: ['demo']
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: INFO
      APP_DATA_MODE: demo
      APP_DATABASE_URL: sqlite:////app/data/demo.db
      APP_LOAD_DEMO_FIXTURE: 'true'
      APP_DEMO_FIXTURE_PATH: /app/fixtures/omeprazole-demo.json
      # Conjunto DEMO de la vertical de revisión: datos de demostración, no reales.
      APP_LOAD_SHOWCASE_FIXTURE: 'true'
      APP_SHOWCASE_FIXTURE_PATH: /app/fixtures/showcase-demo.json
      # El navegador accede al backend directamente durante la demo local.
      APP_CORS_ALLOW_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      APP_REVIEWERS: '["mtorres:M. Torres","jlopez:J. Lopez"]'
    command:
      - sh
      - -c
      - python -m alembic -c backend/alembic.ini upgrade head && python -m uvicorn pharma_validator_api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - demo-data:/app/data
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Modo REAL: maestros ya importados en data/local/real.db.
  #
  #   docker compose --profile real up --build
  #
  # La base se monta desde el host en lugar de vivir en un volumen: la ingesta
  # tarda ~25 minutos y debe sobrevivir a `docker compose down -v`. El montaje
  # es de sólo lectura para el propio contenedor en cuanto al fichero de origen
  # no: la vertical de revisión escribe decisiones, así que se monta el
  # directorio completo en lectura y escritura.
  #
  # Ningún fixture de demostración se carga aquí: las dos variables de fixture
  # quedan explícitamente en 'false' para que un cambio en los valores por
  # defecto no pueda contaminar la base real.
  backend-real:
    profiles: ['real']
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: INFO
      APP_DATA_MODE: real
      APP_DATABASE_URL: sqlite:////app/data/real.db
      APP_LOAD_DEMO_FIXTURE: 'false'
      APP_LOAD_SHOWCASE_FIXTURE: 'false'
      APP_CORS_ALLOW_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      APP_REVIEWERS: '["mtorres:M. Torres","jlopez:J. Lopez"]'
    command:
      - sh
      - -c
      - python -m alembic -c backend/alembic.ini upgrade head && python -m uvicorn pharma_validator_api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data/local:/app/data
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    profiles: ['demo']
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:5173:8080'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend-real:
    profiles: ['real']
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      backend-real:
        condition: service_healthy
    ports:
      - '127.0.0.1:5173:8080'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Sólo para verificar portabilidad del esquema; no participa en el piloto.
  postgres:
    profiles: ['postgres']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: validator
      POSTGRES_PASSWORD: validator
      POSTGRES_DB: validator
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U validator -d validator']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  demo-data:
  postgres-data:
